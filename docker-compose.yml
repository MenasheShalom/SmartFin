services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      INGEST_TOKEN: ${INGEST_TOKEN}
      APP_PASSWORD_HASH: ${APP_PASSWORD_HASH:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      BUDGET_ALERT_LEVELS: ${BUDGET_ALERT_LEVELS:-80,100}
      LOW_BALANCE_THRESHOLD: ${LOW_BALANCE_THRESHOLD:-}
      LARGE_TRANSACTION_THRESHOLD: ${LARGE_TRANSACTION_THRESHOLD:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
    depends_on:
      db:
        condition: service_healthy
    # Localhost only until there's a dashboard; open to the LAN (or Tailscale) later.
    # The "web" network also gives it outbound internet for Telegram/email alerts.
    ports:
      - "127.0.0.1:8000:8000"
    networks: [internal, ingest, web]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Scrapes every account nightly at SCRAPE_TIME (Israel time) and sends the results to
  # the backend. It holds the bank logins; it has internet access and can reach the
  # backend's ingest endpoint, but has no route to the database.
  scraper:
    build: ./scraper
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      INGEST_TOKEN: ${INGEST_TOKEN}
      SCRAPE_TIME: ${SCRAPE_TIME:-03:00}
      SCRAPER_DAYS_BACK: ${SCRAPER_DAYS_BACK:-30}
    volumes:
      - ./scraper/config/accounts.json:/app/config/accounts.json:ro
      - ./scraper/output:/app/output
    depends_on:
      backend:
        condition: service_healthy
    shm_size: 512mb
    networks: [scraper, ingest]

networks:
  # No outbound internet: only backend and db live here.
  internal:
    internal: true
  # Scraper -> backend only, no outbound internet
  ingest:
    internal: true
  web: {}
  scraper: {}
